name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  native-build:
    name: Build and unit test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config gcc \
            libavcodec-dev libavfilter-dev libavutil-dev \
            libdrm-dev libgbm-dev libpixman-1-dev libgnutls28-dev \
            nettle-dev libturbojpeg0-dev zlib1g-dev libpng-dev

      # aml is not packaged on Ubuntu, and neatvnc's meson already falls back
      # to a subproject when it is not found on the system.
      - name: Fetch aml
        run: git clone --depth 1 --branch v0.3.0 https://github.com/any1/aml.git subprojects/aml

      - name: Configure
        run: meson setup build -Dh264=enabled -Dtests=true -Dexamples=true

      - name: Build
        run: ninja -C build

      - name: Unit tests
        run: meson test -C build --print-errorlogs

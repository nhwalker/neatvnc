name: End to end

# Kept separate from ci.yml so a browser-level failure is distinguishable from a
# build failure at a glance, and so the Allure report is scoped to this run.
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    name: Weston + noVNC in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # packaging/build-rpm.sh diffs against the upstream release commit.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.gradle/caches keyed on the build scripts. Without it
          # every run downloads the full dependency set from Maven Central,
          # which rate-limits shared CI runners -- one run here failed on
          # HTTP 429 before a single test executed.
          cache: gradle

      # Used to cut the observation window out of the session recording. The
      # test still runs without it and attaches the untrimmed video.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build the RPM
        run: docker build -f packaging/Containerfile.build --target export -o rpms .

      - name: Build the Weston + noVNC image
        run: docker build -f packaging/Containerfile.test -t neatvnc-nvenc-test:e2e .

      - name: Run the end-to-end test
        working-directory: e2e
        run: ./gradlew test --no-daemon -Dneatvnc.testImage=neatvnc-nvenc-test:e2e

      # A failing run is exactly when the video is worth having, hence always().
      - name: Generate the Allure report
        if: always()
        working-directory: e2e
        run: ./gradlew allureSingleFileReport --no-daemon

      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e/build/allure-report/index.html
          if-no-files-found: warn

      - name: Upload the raw recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-videos
          path: e2e/build/videos/*.mp4
          if-no-files-found: warn
